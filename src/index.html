<!DOCTYPE html>
<html>
    <head>
        <title>SuperSplat</title>
        <meta charset="utf-8" />
        <base href="__BASE_HREF__">
        <link rel="manifest" href="./manifest.json">
        <link rel="stylesheet" href="./index.css">
        <link rel="shortcut icon" href="#">
        <meta name="description" content="SuperSplat is an advanced browser-based editor for manipulating and optimizing 3D Gaussian Splats. It is open source and engine agnostic." />
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />

        <!-- Clear old SuperSplat service workers. This fork is served through host apps and
             stale service-worker caches can leave the iframe on an older editor bundle. -->
        <script>
            const sw = navigator.serviceWorker;
            if (sw) {
                Promise.all([
                    sw.getRegistrations().then(regs => Promise.all(regs.map(reg => reg.unregister()))),
                    window.caches?.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))))
                ]).then(() => {
                    if (sw.controller) {
                        window.location.reload();
                    }
                });
            }
        </script>
        <script>
            window.supersplatConfig = __SUPERSPLAT_CONFIG__;
        </script>
    </head>

    <body>
        <script type="module" src="./index.js"></script>
    </body>
</html>
